name: linux-build-tools
description: Ensure make and a native C toolchain exist on Linux runners (the self-hosted runner lacks them)

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        for tool in make cc c++; do
          command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
        done
        if [ ${#missing[@]} -eq 0 ]; then
          echo "Build tools already present"
        elif command -v apt-get >/dev/null 2>&1; then
          echo "Installing build-essential (missing: ${missing[*]})"
          sudo=""
          if [ "$(id -u)" -ne 0 ]; then
            sudo="sudo -n"
          fi
          export DEBIAN_FRONTEND=noninteractive
          $sudo apt-get update
          $sudo apt-get install -y --no-install-recommends build-essential
        else
          echo "::error::Missing ${missing[*]} and no apt-get to install them; provision make and a C toolchain on this runner"
          exit 1
        fi
        make --version | sed -n 1p
        cc --version | sed -n 1p
